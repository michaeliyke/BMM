<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixed Layout with Scrollable Sections</title>
  <style>
    /* https://chatgpt.com/share/672f6fcd-3ebc-8005-92b8-9b0fde6f82b2 */
    /* Basic reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Page layout */
    body {
      font-family: Arial, sans-serif;
    }

    /* Header - Full width, fixed */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: #333;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      z-index: 1000;
    }

    /* Main content area */
    .main {
      display: flex;
      padding-top: 80px; /* Push down for fixed header */
      height: calc(100vh - 80px); /* Full height minus header */
      overflow: hidden;
    }

    /* Left sidebar */
    .sidebar {
      width: 30%;
      display: flex;
      flex-direction: column;
      background-color: #f4f4f4;
    }

    /* Right content */
    .content {
      width: 70%;
      display: flex;
      flex-direction: column;
      background-color: #eaeaea;
    }

    /* Fixed header and footer */
    .sidebar-header, .sidebar-footer, .content-header, .content-footer {
      padding: 10px;
      background-color: #555;
      color: white;
      text-align: center;
      flex-shrink: 0;
    }

    /* Scrollable middle sections */
    .sidebar-body, .content-body {
      overflow-y: auto;
      padding: 15px;
      flex-grow: 1;
    }

    /* Sample content */
    .sidebar-body ul, .content-body .block {
      margin-bottom: 15px;
    }

    .content-body .block {
      background-color: #ccc;
      padding: 20px;
      margin-bottom: 15px;
      height: 150px;
    }
  </style>
</head>
